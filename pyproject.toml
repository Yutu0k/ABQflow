[project]
authors = [{name = "yutu0k", email = "yutu0k@sjtu.edu.cn"}]
dependencies = [
	"numpy",
	"psutil",
	"rich",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Scientific/Engineering",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["abaqus", "fea", "finite-element-analysis", "batch-processing", "workflow", "simulation"]
license = { file = "LICENSE" }
name = "ABQflow"
description = "A modular batch-processing framework for Abaqus FEA — typed job specs, strategy pattern workflow, fault-tolerant parallel execution, and resource-aware scheduling."
requires-python = ">=3.9"
readme = "README.md"
version = "0.5.1"

[project.optional-dependencies]
abqpy = [
	"abqpy>=2025.9,<2026",
]
remote = [
	"paramiko>=3.4",
]
dev = [
	"furo>=2024.8.6,<2025",
	"ipykernel",
	"ipywidgets>=8.1.7,<9",
	"jupyter",
	"myst-parser>=4.0.1,<5",
	"pytest>=8.4.1,<9",
	"pytest-dependency>=0.5.1,<0.6",
	"sphinx>=8.1.3,<9",
]

[project.scripts]
abqflow-check-hook = "ABQflow.check_hook:main"

[project.urls]
Homepage = "https://github.com/Yutu0k/ABQflow"
Issues = "https://github.com/Yutu0k/ABQflow/issues"
Source = "https://github.com/Yutu0k/ABQflow"

[tool.hatch.build.targets.wheel]
packages = ["src/ABQflow"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
ABQflow = { path = ".", editable = true }
build = ">=1.5.0,<2"

[tool.pixi.tasks]
docs-generate = "sphinx-apidoc -o docs/source/api -d 1 -T src/ABQflow"
docs-build = "sphinx-build docs docs/_build/html"
docs-serve-static = "python -m http.server -d docs/_build/html 8080"
docs-serve = "sphinx-autobuild docs docs/_build/html --host 127.0.0.1 --port 8080"
docs-gettext = "sphinx-build -M gettext docs docs/_build/gettext"
docs-translation-update = "sphinx-intl update -d docs/locale -p docs/_build/gettext/gettext -l zh_CN"
docs-translation = { cmd = "sphinx-intl update -d docs/locale -p docs/_build/gettext/gettext -l zh_CN", depends-on = ["docs-gettext"] }
docs-build-en = "sphinx-build -b html -D language=en docs docs/_build/html/en"
docs-build-zh = { cmd = "sphinx-build -b html -D language=zh_CN docs docs/_build/html/zh_CN", depends-on = ["docs-translation"] }
docs-build-root = "sphinx-build -b html -D language=en docs docs/_build/html"
docs-build-all = { cmd = "python -c \"print('English and Chinese documentation built.')\"", depends-on = ["docs-build-root", "docs-build-en", "docs-build-zh"] }


[tool.pixi.dependencies]
python = "3.11.*"
numpy = "*"
rich = ">=14.1.0,<15"
pytest = ">=8.4.1,<9"
sphinx = ">=8.1.3,<9"
furo = ">=2024.8.6,<2025"
pytest-dependency = ">=0.5.1,<0.6"
myst-parser = ">=4.0.1,<5"

jupyter = "*"
ipykernel = "*"
ipywidgets = ">=8.1.7,<9"
pip = ">=26.0.1,<27"
twine = ">=7.0.0,<8"
paramiko = ">=5.0.0,<6"
python-dotenv = ">=1.2.3,<2"
sphinx-intl = ">=2.3.2,<3"
sphinx-autobuild = ">=2025.8.25,<2026"
