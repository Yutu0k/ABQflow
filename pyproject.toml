[project]
authors = [{name = "yutu0k", email = "yutu0k@sjtu.edu.cn"}]
dependencies = [
	"numpy",
	"rich",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Scientific/Engineering",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["abaqus", "fea", "finite-element-analysis", "batch-processing", "workflow", "simulation"]
license = { file = "LICENSE" }
name = "ABQflow"
description = "A modular batch-processing framework for Abaqus FEA — typed job specs, strategy pattern workflow, fault-tolerant parallel execution, and resource-aware scheduling."
requires-python = ">=3.9"
readme = "README.md"
version = "0.4.0"

[project.optional-dependencies]
abqpy = [
	"abqpy>=2025.9,<2026",
]
dev = [
	"furo>=2024.8.6,<2025",
	"ipykernel",
	"ipywidgets>=8.1.7,<9",
	"jupyter",
	"myst-parser>=4.0.1,<5",
	"pytest>=8.4.1,<9",
	"pytest-dependency>=0.5.1,<0.6",
	"sphinx>=8.1.3,<9",
]

[project.urls]
Homepage = "https://github.com/Yutu0k/ABQflow"
Issues = "https://github.com/Yutu0k/ABQflow/issues"
Source = "https://github.com/Yutu0k/ABQflow"

[tool.hatch.build.targets.wheel]
packages = ["src/ABQflow"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
ABQflow = { path = ".", editable = true }
build = ">=1.5.0,<2"

[tool.pixi.tasks]
docs-generate = "sphinx-apidoc -o docs/source src/ABQflow"
docs-build = "sphinx-build docs docs/_build/html"
docs-serve = "python -m http.server -d docs/_build/html 8080"


[tool.pixi.dependencies]
python = "3.11.*"
numpy = "*"
rich = ">=14.1.0,<15"
pytest = ">=8.4.1,<9"
sphinx = ">=8.1.3,<9"
furo = ">=2024.8.6,<2025"
pytest-dependency = ">=0.5.1,<0.6"
myst-parser = ">=4.0.1,<5"

jupyter = "*"
ipykernel = "*"
ipywidgets = ">=8.1.7,<9"
pip = ">=26.0.1,<27"
twine = ">=7.0.0,<8"
